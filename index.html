<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>特別支援教育 10問クイズ</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;color:#202124;background:#f5f6f8}
*{box-sizing:border-box}body{margin:0;padding:18px}.wrap{max-width:720px;margin:0 auto}.card{background:white;border:1px solid #e0e3e7;border-radius:18px;padding:22px;box-shadow:0 3px 12px #00000008}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14px;color:#555}.pill{background:#e9eefc;color:#244b9b;border-radius:999px;padding:6px 11px;font-weight:700}.bar{height:6px;background:#e8eaf0;border-radius:20px;overflow:hidden;margin:16px 0 24px}.fill{height:100%;background:#375fc7;width:0;transition:width .2s}
h1{font-size:25px;line-height:1.35;margin:0 0 8px}h2{font-size:20px;line-height:1.5;margin:0 0 16px}.topic{color:#5a6472;font-size:14px;margin-bottom:12px}.option{display:flex;align-items:flex-start;gap:12px;border:1px solid #d9dde4;border-radius:12px;padding:14px;margin:10px 0;cursor:pointer;line-height:1.55}.option input{margin-top:5px;flex-shrink:0;accent-color:#375fc7}.option.selected{border-color:#375fc7;background:#f0f4ff}.option.correct{border-color:#198754;background:#effaf3}.option.wrong{border-color:#c33;background:#fff3f3}button{border:0;border-radius:12px;padding:14px 18px;font-size:16px;font-weight:700;cursor:pointer;width:100%;background:#244fbd;color:white;margin-top:12px}button:disabled{opacity:.4;cursor:not-allowed}.feedback{margin-top:18px;padding:16px;border-radius:12px;background:#f0f2f5;line-height:1.65}.good{color:#167344;font-weight:800}.bad{color:#b42318;font-weight:800}.small{font-size:13px;color:#666}.resultscore{font-size:42px;font-weight:800;text-align:center;margin:12px 0}.resultsub{text-align:center;font-size:18px;font-weight:700}.review{border:1px solid #e0e3e7;border-radius:12px;padding:14px;margin:12px 0}.review h3{font-size:16px;margin:0 0 8px}.review p{line-height:1.6;margin:6px 0}.hidden{display:none}.footer{text-align:center;color:#747b86;font-size:12px;margin:18px}
</style>
</head>
<body><main class="wrap">
<section class="card" id="quiz">
<div class="top"><span class="pill" id="count">第1問 / 10問</span><span id="scoretop">正解 0問</span></div>
<div class="bar"><div class="fill" id="progress"></div></div>
<div class="topic" id="topic"></div><h2 id="question"></h2><div id="options"></div>
<div id="feedback" class="feedback hidden" aria-live="polite"></div>
<button id="submit" disabled>回答する</button><button id="next" class="hidden">次の問題へ →</button>
</section>
<section class="card hidden" id="results"><h1 style="text-align:center">クイズ結果発表！</h1><div class="resultscore" id="finalscore"></div><div class="resultsub" id="message"></div><div class="bar"><div class="fill" id="finalbar"></div></div><p id="accuracy" style="text-align:center"></p><h2>問題ごとの結果・解説</h2><div id="reviewlist"></div><button id="restart">もう一度挑戦する ↻</button></section>
<div class="footer">特別支援教育 10問クイズ</div></main>
<script>
const data = [
{t:"特別支援教育の制度・教育課程",q:"次のうち、正しいものを一つ選びなさい。",o:["特別支援学校では、自立活動の指導は必ずしも行わなくてもよい。","特別支援学級では、特別の教育課程は認められていない。","教育・医療・福祉などの関係機関が連携して作成するものは、個別の指導計画である。","個別の教育支援計画は、校長を中心として学校が作成する。","個別の教育支援計画や個別の指導計画は、通常の学級に在籍する障害のある児童生徒についても必ず作成することが示されている。"],a:3,e:"個別の教育支援計画は、学校を中心に関係機関等と連携して作成・活用する計画です。個別の指導計画は、具体的な指導目標や内容、方法を定めます。"},
{t:"視覚障害・聴覚障害の基礎",q:"次のうち、正しいものを一つ選びなさい。",o:["視力が同じであれば、実際の見え方も同じである。","日本の組織的な視覚障害教育・聴覚障害教育は、大正期に入ってから始まった。","視覚障害のある子供には、発達の遅れはみられない。","聴覚障害のある全ての子供に、手話による意思伝達を指導する。","聴覚障害とは、耳介から大脳の第一次聴覚野に至る経路のどこかに障害が生じている状態を指す。"],a:4,e:"聴覚障害は、聴覚に関わる経路のどこかに障害が生じた状態を指します。コミュニケーション方法は一人一人の実態に応じて工夫します。"},
{t:"視覚障害・聴覚障害の指導",q:"次のうち、正しいものを一つ選びなさい。",o:["伝音難聴は音がひずみ、感音難聴は音が小さく聞こえる障害である。","視覚は接触感覚である。","難聴の通級による指導は、通常の学級での教科の遅れを取り戻すための補充指導である。","盲学校・聾学校の義務制完成後、在籍児童生徒数は一貫して増加している。","視覚は、主に眼球、視路、視覚中枢の働きによって外界からの光を刺激として捉える働きである。"],a:4,e:"視覚は眼球、視神経などの視路、視覚中枢が働くことで成立します。視覚は接触感覚ではなく、遠隔感覚です。"},
{t:"知的障害・病弱教育",q:"次のうち、正しいものを一つ選びなさい。",o:["知的障害の実態把握は、知能検査や発達検査の数値のみで行う。","知的障害のある子供の教育課程では、実態や発達段階、地域の特色を踏まえ、実生活に結び付いた内容を重視する。","長期入院しても、経験不足や仲間関係の形成への影響は生じない。","病弱教育には、学力を補う役割はあるが、心理的安定を支える役割はない。","通常の学級に在籍する病弱・身体虚弱の児童生徒は、通級による指導の対象にならない。"],a:1,e:"知的障害教育では、子供の実態や発達段階などを踏まえ、実生活に結び付いた学習内容を重視します。検査の数値だけで判断しません。"},
{t:"肢体不自由教育",q:"次のうち、正しいものを一つ選びなさい。",o:["肢体不自由のある子供の学びの場は、特別支援学校と特別支援学級のみである。","特別支援学校の対象となる肢体不自由は、補装具によって日常生活の基本動作が可能な程度である。","肢体不自由特別支援学校に在籍する子供の多くは、筋原性疾患の脳性まひである。","車椅子などの補助具や機器を活用し、学習への参加を促している。","自立活動では、身体の動きの指導を中心に行えばよい。"],a:3,e:"車椅子などの補助具や機器は、学習活動への参加を支えるために活用されます。自立活動では身体の動き以外の課題も扱います。"},
{t:"重複障害・医療的ケア",q:"次のうち、正しいものを一つ選びなさい。",o:["重複障害者とは、定められた5つの障害のうち2つを併せ有する者のみを指す。","特別支援学校の重複障害学級では、1学級の児童生徒数は3人を標準とする。","医療的ケアを必要とする児童生徒は、全員が特別支援学校で学ぶ。","重複障害のある児童生徒は、必ず自立活動を主とする教育課程で学ぶ。","実態把握では家庭での様子を知る必要はない。"],a:1,e:"添付問題では、特別支援学校の重複障害学級は1学級3人を標準とする、という記述が正解とされています。"},
{t:"重複障害のある子供への支援",q:"次のうち、正しいものを一つ選びなさい。",o:["特別支援学校小学部で重複障害学級に在籍する児童は1割に満たない。","学校における医療的ケアは、看護師だけが行える。","重複障害の原因は、すべて出生前の原因である。","音声言語で意思を伝えられるとは限らず、一人一人に応じて情報提示を工夫する必要がある。","重複障害のある子供には、能力が高度化するタテ方向の発達だけを重視する。"],a:3,e:"コミュニケーションや情報を受け取る手段は子供によって異なるため、実態に応じた情報提示が必要です。"},
{t:"発達障害と二次的な障害",q:"次のうち、正しいものを一つ選びなさい。",o:["発達障害の特性は変化せず、診断が変わったり加えられたりすることはない。","二次的な障害は、小学校入学時に最も生じやすく、その後はほとんど生じない。","適切な指導や必要な支援がなされないことによる二次的な障害も多い。","不安や引きこもりは外在化障害、反抗や暴力は内在化障害である。","実態把握では、まず心理検査の結果から判断する。"],a:2,e:"適切な指導や支援がなされないことで、二次的な障害につながる場合があります。不安などは内在化、外に表れる行動上の問題は外在化に分類されます。"},
{t:"学習障害（LD）",q:"次のうち、正しいものを一つ選びなさい。",o:["知的発達に遅れがあっても、認知能力にアンバランスがあれば学習障害と判断できる。","学習障害は、特定の学習能力の習得と使用に著しい困難を示す状態であり、ほかの発達障害と併存する場合もある。","学習障害は、視覚障害や環境的な要因が直接の原因となる場合もある。","苦手な点に指導を集中し、苦手意識を克服させることだけが大切である。","通級による指導では、教科の遅れを取り戻す補充指導が認められている。"],a:1,e:"LDは、聞く・話す・読む・書く・計算する・推論する能力のうち、特定の能力に著しい困難を示す状態です。ほかの発達障害と併存する場合もあります。"},
{t:"注意欠如多動症（ADHD）",q:"次のうち、正しいものを一つ選びなさい。",o:["不注意または多動性・衝動性の特徴が1つでも激しければ診断される。","対応では、注意を繰り返して本人の自覚を促すことが最優先である。","ADHDは、ほかの発達障害の症状を併せ有することはない。","誤りを指摘するだけでなく、望ましい行動を認める経験を積み、適切な行動に意識を向けられるよう支援することが大切である。","学校や家庭など、1か所で症状による不適応が頻繁に見られれば診断される。"],a:3,e:"望ましい行動を具体的に示し、その行動が認められる経験を積み重ねる支援が重要です。"}
];
let idx=0, selected=null, submitted=false, answers=[];
const $=id=>document.getElementById(id);
function render(){
 const d=data[idx]; selected=null; submitted=false;
 $("count").textContent=`第${idx+1}問 / 10問`; $("scoretop").textContent=`正解 ${answers.filter((a,j)=>a===data[j].a).length}問`;
 $("progress").style.width=`${idx*10}%`; $("topic").textContent=d.t; $("question").textContent=d.q;
 $("options").innerHTML="";
 d.o.forEach((v,j)=>{const label=document.createElement("label");label.className="option";label.innerHTML=`<input type="radio" name="answer" value="${j}"><span>${j+1}. ${v}</span>`;label.addEventListener("click",()=>{if(submitted)return;selected=j;document.querySelectorAll(".option").forEach(x=>x.classList.remove("selected"));label.classList.add("selected");$("submit").disabled=false});$("options").appendChild(label)});
 $("feedback").classList.add("hidden");$("next").classList.add("hidden");$("submit").classList.remove("hidden");$("submit").disabled=true;
}
$("submit").addEventListener("click",()=>{if(selected===null||submitted)return;submitted=true;answers[idx]=selected;const d=data[idx];const fb=$("feedback");fb.classList.remove("hidden");fb.innerHTML=`<div class="${selected===d.a?"good":"bad"}">${selected===d.a?"正解！":"不正解"}</div><p><b>正解：選択肢 ${d.a+1}</b></p><p>${d.e}</p>`;document.querySelectorAll(".option").forEach((el,j)=>{el.querySelector("input").disabled=true;if(j===d.a)el.classList.add("correct");if(j===selected&&selected!==d.a)el.classList.add("wrong")});$("submit").classList.add("hidden");$("next").textContent=idx===9?"結果を見る →":"次の問題へ →";$("next").classList.remove("hidden")});
$("next").addEventListener("click",()=>{if(idx<9){idx++;render()}else showResults()});
function showResults(){const score=answers.filter((a,j)=>a===data[j].a).length;$("quiz").classList.add("hidden");$("results").classList.remove("hidden");$("finalscore").textContent=`${score} / 10 問正解`;$("finalbar").style.width=`${score*10}%`;$("accuracy").textContent=`正答率 ${score*10}%`;$("message").textContent=score===10?"全問正解！すばらしい！":score>=8?"よくできました！":score>=6?"あと少し！復習してみましょう":"解説を確認して、もう一度挑戦しましょう！";$("reviewlist").innerHTML="";data.forEach((d,j)=>{const ok=answers[j]===d.a;const div=document.createElement("div");div.className="review";div.innerHTML=`<h3>第${j+1}問：${d.t}　<span class="${ok?"good":"bad"}">${ok?"正解":"不正解"}</span></h3><p>あなたの回答：${answers[j]+1}番${ok?"":` ／ 正解：${d.a+1}番`}</p><p>${d.e}</p>`;$("reviewlist").appendChild(div)})}
$("restart").addEventListener("click",()=>{idx=0;answers=[];$("results").classList.add("hidden");$("quiz").classList.remove("hidden");render();window.scrollTo(0,0)});
render();
</script></body></html>
